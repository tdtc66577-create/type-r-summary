function render(){
  const listEl = document.getElementById('list');
  listEl.innerHTML='';
  let s14=0,s30=0,s45=0,s60=0,st=0;
  GROUPS.forEach(g=>{s14+=g.c14;s30+=g.c30;s45+=g.c45;s60+=g.c60;st+=g.total;});

    const isOpen = expanded.has(g.supervisor);
    const row = document.createElement('div');
    row.className = 'grid grid-cols-[1fr_72px_72px_72px_72px_72px] bg-[#e2e8f0] hover:bg-[#d6e0f0] cursor-pointer border-b border-slate-200 items-center transition-colors';

        <span class="shrink-0 w-6 h-6 rounded-md bg-white border border-slate-300 flex items-center justify-center text-[10px] shadow-sm">${isOpen?'▼':'▶'}</span>
        <span class="font-bold text-[13px] text-slate-900 truncate">${g.supervisor}</span>
        <span class="shrink-0 bg-slate-900 text-white text-[11px] px-2 py-0.5 rounded-full font-bold">${g.total}</span>

      <div class="text-center text-[13px] font-bold">${g.c14||'<span class=opacity-30>0</span>'}</div>
      <div class="text-center text-[13px] font-bold">${g.c30||'<span class=opacity-30>0</span>'}</div>
      <div class="text-center text-[13px] font-bold">${g.c45||'<span class=opacity-30>0</span>'}</div>
      <div class="text-center text-[13px] font-bold ${g.c60>0?'text-orange-600':''}">${g.c60||'<span class=opacity-30>0</span>'}</div>
      <div class="text-center text-[13px] font-bold">${g.total}</div>
    `;
    row.onclick = ()=>{ if(isOpen) expanded.delete(g.supervisor); else expanded.add(g.supervisor); render(); };
    listEl.appendChild(row);
    if(isOpen){
      g.children.forEach(ch=>{
        const isSite = ch.label.startsWith('SY-') || ch.label.startsWith('EX-');
        const r = document.createElement('div');
        r.className = isSite ? 'grid grid-cols-[1fr_72px_72px_72px_72px_72px] bg-blue-50/80 border-b border-blue-100 items-center' : 'grid grid-cols-[1fr_72px_72px_72px_72px_72px] bg-white border-b border-slate-100 items-center hover:bg-slate-50';
