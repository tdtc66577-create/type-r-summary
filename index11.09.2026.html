    const r=document.createElement('div'); r.className='grid grid-cols-[1fr_68px_68px_68px_68px_68px_68px] bg-[#e2e8f0] border-b cursor-pointer hover:bg-[#d6e0f0] items-center';
    r.innerHTML=`<div class="px-3 py-3 flex items-center gap-2"><span class="w-6 h-6 rounded bg-white border flex items-center justify-center text-[10px]">${open?'▼':'▶'}</span><span class="font-bold text-[13px] truncate">${g.supervisor}</span><span class="bg-slate-900 text-white text-[11px] px-2 py-0.5 rounded-full">${g.total}</span></div><div class="text-center text-[13px] font-bold">${g.c14||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[13px] font-bold">${g.c30||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[13px] font-bold">${g.c45||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[13px] font-bold">${g.c60||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[13px] font-bold ${g.c90?'text-red-600':''}">${g.c90||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[13px] font-bold">${g.total}</div>`;
    r.onclick=()=>{ if(open) expanded.delete(g.supervisor); else expanded.add(g.supervisor); render(); };
    list.appendChild(r);
    if(open){ g.children.forEach(ch=>{
      const isSite=ch.label.startsWith('SY-')||ch.label.startsWith('EX-');
      const row=document.createElement('div'); row.className=isSite?'grid grid-cols-[1fr_68px_68px_68px_68px_68px_68px] bg-blue-50 border-b border-blue-100 items-center':'grid grid-cols-[1fr_68px_68px_68px_68px_68px_68px] bg-white border-b items-center';
      row.innerHTML=`<div class="${isSite?'pl-11 pr-3 py-2.5 font-bold text-[12px] text-[#1e3a8a] truncate':'pl-[52px] pr-3 py-2 text-[12px] text-slate-600 truncate'}">${ch.label}</div><div class="text-center text-[12px]">${ch.c14||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[12px]">${ch.c30||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[12px]">${ch.c45||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[12px]">${ch.c60||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[12px] ${ch.c90?'text-red-600 font-bold':''}">${ch.c90||'<span class=opacity-30>0</span>'}</div><div class="text-center text-[12px] font-bold">${ch.total}</div>`;
      list.appendChild(row);
    });}
  });
  document.getElementById('grand').innerHTML=`<div class="px-4 py-3">Grand Total</div><div class="py-3 text-center">${t14}</div><div class="py-3 text-center">${t30}</div><div class="py-3 text-center">${t45}</div><div class="py-3 text-center">${t60}</div><div class="py-3 text-center">${t90}</div><div class="py-3 text-center">${tt}</div>`;
}
render();
</script></body></html>
